# ============================================================
# Jarvis configuration — swap models/providers here, not in code
# ============================================================

llm:
  # How many past user/assistant turns to keep in the prompt
  # (smaller = faster local prefill; memory recalls older facts anyway)
  max_history_turns: 10

  # Hybrid brain: each tier picks its own provider + model.
  # provider: ollama (local, free, private) | anthropic | openai_compatible
  tiers:
    # Everyday voice turns: Haiku = answers start in ~1-2s (~$2-4/month at
    # heavy use). If the cloud is unreachable this degrades automatically to
    # the free local model below. For $0-but-slower (~5-9s), swap this tier
    # back to: provider: ollama, model: qwen3:8b.
    # (Don't use qwen3:4b — broken no-think in Ollama, rambles out loud.)
    default:
      provider: anthropic
      model: claude-haiku-4-5
      max_tokens: 300
    # Free local fallback used automatically when the cloud tier errors
    fallback_local:
      provider: ollama
      model: qwen3:8b
      max_tokens: 512
    # Hard turns (code, multi-step analysis): Claude Sonnet 5
    hard:
      provider: anthropic
      model: claude-sonnet-5
      thinking: adaptive
      effort: high
      max_tokens: 2048
    # Deep-research synthesis (cited reports)
    research:
      provider: anthropic
      model: claude-sonnet-5
      thinking: adaptive
      effort: high
      max_tokens: 4096
    # Research page-note distillation: local, free
    summarize:
      provider: ollama
      model: qwen3:8b
      max_tokens: 700
    # Life HQ: Jarvis as the main agent on text channels (Telegram, the
    # dashboard) and in scheduled check-ins, where judgement beats latency
    coordinator:
      provider: anthropic
      model: claude-opus-5-5
      thinking: adaptive
      effort: medium
      max_tokens: 8000
      fallbacks: default     # server-side refusal fallbacks (beta)
    # Life HQ: the area subagents (Work, Projects, Fitness, Health, Life)
    area:
      provider: anthropic
      model: claude-sonnet-5-5
      thinking: adaptive
      effort: medium
      max_tokens: 8000
      fallbacks: default

  ollama:
    url: http://localhost:11434
    keep_alive: -1          # never unload: cold model load costs ~30s on 16GB

  # USD per 1M tokens (Sonnet 5 intro pricing through 2026-08-31,
  # then 3.00 / 15.00; cache write = 1.25x input, cache read = 0.1x)
  pricing:
    claude-sonnet-5:  { input: 2.00, output: 10.00, cache_write: 2.50, cache_read: 0.20 }
    claude-haiku-4-5: { input: 1.00, output: 5.00,  cache_write: 1.25, cache_read: 0.10 }
    claude-opus-5-5:   { input: 4.00, output: 20.00, cache_write: 5.00, cache_read: 0.20 }
    claude-sonnet-5-5: { input: 2.00, output: 10.00, cache_write: 2.50, cache_read: 0.10 }

  # Escape hatch: point any tier at an OpenAI-style endpoint
  # (DeepSeek, Qwen cloud, Kimi, GLM...). Text-only, no tool calling.
  openai_compatible:
    base_url: https://api.deepseek.com
    api_key_env: LLM_API_KEY
    pricing: {}   # fill in if you want cost logging on this provider

routing:
  # A turn is routed to the "hard" model if it matches any of these.
  min_words_hard: 80
  hard_keywords:
    - code
    - script
    - function
    - refactor
    - debug
    - regex
    - sql
    - analyze
    - analysis
    - compare
    - plan out
    - step by step
    - architecture
    - spreadsheet
    - calculate

research:
  results_per_query: 3      # search hits considered per sub-query
  pages_per_query: 2        # pages actually read per sub-query

turn:
  # if you pause mid-thought it waits this long for you to continue before
  # answering what it has (raise if it still jumps in; lower if it lags)
  continuation_timeout: 1.2
  # false-trigger protection: a frame must be BOTH speech-shaped (webrtcvad,
  # 0-3) AND loud enough (int16 RMS) to count. Raise the floor if it still
  # triggers on room noise; lower it if it misses quiet speech.
  vad_aggressiveness: 3
  vad_energy_floor: 300
  # while its reply is playing, only speech LOUDER than this counts (so its
  # own voice from your speakers can't interrupt itself). Lower if barge-in
  # is hard to trigger; use headphones for the best experience.
  barge_energy_floor: 1400

workspace:
  # The ONE folder Jarvis may write files in: iCloud Drive/Jarvis, so it is
  # the same folder on every Mac signed in to your Apple ID. It holds one
  # subfolder per life area (see life.areas) plus Inbox/.
  # iCloud Drive is privacy-protected: the background service (make
  # install-web) needs Full Disk Access for its Python.app (`make life
  # ARGS=python-path` prints it), or access is refused. Jarvis still starts
  # without it; `make life` and the website's Setup page show the problem.
  # Also: Finder > iCloud Drive > Jarvis > right-click > Keep Downloaded,
  # so files are always on the Mac mini's disk, not cloud-only.
  path: ~/Library/Mobile Documents/com~apple~CloudDocs/Jarvis
  trash_subdir: "_trash"    # old versions land here before any overwrite/edit

# Life HQ: Jarvis as the main agent of a personal organiser. He talks to you
# (voice, Telegram, the website) and delegates to one agent per life area;
# each area agent owns its folder in iCloud Drive/Jarvis, a CONTEXT.md brief,
# and that area's reminders/tasks/logs. Code: src/life/.
life:
  owner: Francesco
  timezone: Australia/Sydney
  db: data/life.db            # reminders, tasks, logs: local SQLite, NEVER in iCloud
  inbox: Inbox
  backup_keep: 14             # nightly copies of the database in Jarvis/_backups
  coordinator_tier: coordinator   # Jarvis on Telegram, the dashboard and check-ins
  area_tier: area                 # the area agents
  subagent_max_rounds: 12
  subagent_timeout_s: 240
  telegram:
    enabled: true             # needs TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID in .env

  areas:
    - id: work
      name: Work
      emoji: "💼"
      folder: Work
      blurb: Job, meetings, deadlines, career
      focus: >-
        You run the Work area. Keep work tasks prioritised and deadlines
        visible, help plan the week, and turn vague intentions into concrete
        next actions with dates. Flag anything overdue or at risk early.
    - id: projects
      name: Projects
      emoji: "🚀"
      folder: Projects
      blurb: Side projects and personal builds
      focus: >-
        You run the Projects area. For each active project keep a clear goal,
        the next milestone with a date, and one concrete next action, with a
        subfolder per project for its notes and plans. Notice stalled projects
        and help either restart them or consciously park them.
    - id: fitness
      name: Fitness
      emoji: "🏋️"
      folder: Fitness
      blurb: Training, activity, sport
      focus: >-
        You are the fitness coach. Track workouts and activity from the logs,
        keep the training plan realistic, and encourage consistency without
        guilt. Log workouts as metric "workout" with the duration in minutes as
        the value and the details in the note. Keep the current plan in
        training-plan.md.
    - id: health
      name: Health
      emoji: "🩺"
      folder: Health
      blurb: Sleep, food, meds, appointments, mood
      focus: >-
        You look after the Health area: sleep, nutrition, hydration,
        medication, appointments, mood and body metrics. Spot trends in the
        logs and keep appointments and refills from slipping. Use the metrics
        "sleep_hours", "mood" (1-5) and "energy" (1-5) consistently. You are
        not a doctor: for symptoms or medical decisions, suggest seeing one.
    - id: life
      name: Life
      emoji: "🏡"
      folder: Life
      blurb: Admin, money, home, people, errands
      focus: >-
        You run the Life area: personal admin, bills and finances, home,
        errands, birthdays, friends and family. Keep recurring obligations on
        reminders so nothing is forgotten, and batch small errands sensibly.

  # Scheduled messages ("one voice": only Jarvis messages you). Times are in
  # life.timezone. If the Mac was off at the time, a check-in still runs if
  # it is back within catch_up_minutes (default 120), otherwise it is skipped.
  checkins:
    - key: morning-brief
      label: Daily 07:30 · morning brief
      time: "07:30"
      days: daily
      task: >-
        Morning brief. Call life_overview, then write one compact message:
        today's reminders and deadlines grouped by area with the area emoji,
        anything overdue, and the top 3 things to focus on today. On Mondays,
        also list this week's deadlines.
    - key: evening-checkin
      label: Daily 21:00 · evening check-in
      time: "21:00"
      days: daily
      task: >-
        Evening check-in, at most four short lines. Call life_overview to see
        what is logged today, then ask how today went and invite a one-line
        reply covering whatever isn't logged yet: sleep last night (hours),
        training today, mood and energy (1-5). Mention tomorrow's first
        reminder or deadline if there is one.
    - key: weekly-review
      label: Sun 19:00 · weekly review and plan
      time: "19:00"
      days: [sun]
      catch_up_minutes: 240
      task: >-
        Weekly review and plan. In a single turn, delegate to all five area
        agents (work, projects, fitness, health, life) at once: each reviews
        its area for the past 7 days, plans the coming week, creates the
        reminders and tasks that are clearly needed, and reports wins, what
        slipped, next week's focus and what it created. Then write one combined
        message: one or two lines per area, then the reminders created.

profile:
  file: data/profile.md     # your hand-edited "About Me" (gitignored, private)

server:
  port: 8765
  # token that the web app must send to reach this Mac. Set JARVIS_TOKEN in .env
  # to any long random string, and set the same value in Vercel.

wakeword:
  enabled: true             # require the phrase before responding (voice mode)
  phrase: hey jarvis
  aliases: [jarvis, hey travis, hey jervis]   # common mis-transcriptions
  active_window: 60         # seconds after an exchange where no phrase is needed

persona:
  name: Jarvis
  # Keep this file byte-stable: it is the cached prompt prefix.
  system_prompt_file: prompts/system.md

stt:
  engine: realtime_stt
  model: large-v3-turbo     # faster-whisper model for `make voice`
  # web/voice-server model. small.en (~1.2s) gets your names right with the
  # vocabulary bias below; bump to medium.en for flawless-but-3x-slower.
  web_model: small.en
  language: en              # "" for auto-detect
  device: cpu               # ctranslate2 has no Metal backend; cpu + int8 is the Apple Silicon path
  compute_type: int8
  beam_size: 5              # higher = more accurate (small model, still fast)
  # proper nouns Whisper otherwise mangles ("Mareluna" -> "marijuana"). Names
  # from your About-Me profile are added automatically; add more here.
  vocabulary: "Mareluna, Giulia, Ligurian, Jarvis, Jonny"
  min_avg_logprob: -1.0     # below this = probably misheard → ask to repeat
  max_no_speech: 0.6        # above this = probably wasn't real speech
  # black-box recorder: keeps the last 20 utterances + what Whisper heard in
  # data/debug_utterances + data/stt.log (private, Mac-only) for diagnosis
  debug_save: true
  silence_duration: 0.5     # seconds of silence that end an utterance. Safe to
                            # keep short: if it cuts you off mid-thought, the
                            # turn-taking layer holds and waits for the rest.
  # start transcribing DURING the silence window (engine fast path): by the
  # time the turn is confirmed over, the text is already ready (~saves 0.5-1s)
  early_transcription_on_silence: 0.25
  initial_prompt: "Hey Jarvis."   # biases Whisper toward hearing the wake phrase
  input_device_index: null  # null = system default mic; `make mic-test` lists devices

tts:
  engine: kokoro            # kokoro | say (auto-falls back to say on failure)
  voice: bm_george          # deep British male. Others: bm_fable, bm_daniel,
                            # bm_lewis / American: am_onyx, am_michael...
  speed: 1.1                # >1 = brisker delivery
  lang_code: b              # 'b' = British English, 'a' = American
  device: ""                # cpu: kokoro on MPS fights qwen for the GPU
  # spoken instantly when the real answer takes longer than ack_after seconds
  acks: ["One sec.", "Hmm, let me think.", "On it.", "Right, give me a moment."]
  ack_after: 0.9
  # spoken when it can't make out what you said (instead of guessing)
  reprompts: ["Sorry, I didn't catch that.", "Come again?", "Say that once more?"]
  say_voice: ""             # macOS say fallback; "" = system default
  say_rate: 190

memory:
  backend: mem0             # mem0 | none
  user_id: francesco
  top_k: 3                  # memories injected per turn (smaller = faster local prefill)
  min_score: 0.45           # relevance floor: weak matches are worse than none
  extraction_llm: claude-haiku-4-5   # cheap model that distills facts after each turn
  embed_model: nomic-embed-text      # local via Ollama, free
  ollama_url: http://localhost:11434
  data_dir: data/mem0

knowledge:
  backend: chroma           # chroma | none
  folder: knowledge         # drop .md/.txt/.pdf files here
  top_k: 3                  # chunks injected per turn (smaller = faster local prefill)
  max_distance: 0.52        # cosine distance cutoff; higher = looser matching
                            # (strict on purpose: irrelevant chunks derail answers)
  chunk_size: 1500          # chars per chunk
  chunk_overlap: 200
  embed_model: nomic-embed-text
  ollama_url: http://localhost:11434
  data_dir: data/knowledge
  watch: true               # re-index automatically when files change
