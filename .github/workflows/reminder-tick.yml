# Calls the app's scheduler endpoint every 5 minutes: sends due reminders and
# relays late agent replies. No model calls happen in the tick.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   APP_URL      e.g. https://jonny.vercel.app (no trailing slash)
#   CRON_SECRET  same value as the CRON_SECRET env var in Vercel
#
# Caveats: scheduled workflows only run from the default branch, GitHub often
# starts them 5-15+ minutes late, and it disables them after 60 days without
# repository activity. The morning brief warns if the tick goes stale; any
# other scheduler can call the same endpoint instead (e.g. cron-job.org).

name: Reminder tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: reminder-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets are not set yet; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/tick"
